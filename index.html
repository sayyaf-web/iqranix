<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iqranix</title>

    <meta name="theme-color" content="#0B8457">

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/responsive.css">

</head>

<body>

<main id="dashboard">

    <!-- HEADER -->
    <header class="topHeader">

        <button class="menuBtn">☰</button>

        <div class="greetingSection">
            <h2 id="greeting">Assalamu Alaikum</h2>
            <p id="greetingMessage">
                Your Daily Islamic Companion
            </p>
        </div>

        <div class="headerRight">

            <div class="locationBox">
                <span>📍</span>
                <span id="currentLocation">
                    Detecting...
                </span>
            </div>

            <button class="notificationBtn">
                🔔
            </button>

        </div>

    </header>

    <!-- HERO -->
    <section class="hero">

        <div class="heroBackground"></div>

        <div class="heroOverlay">

            <!-- LEFT -->
            <div class="heroLeft">

                <span class="heroBadge">
                    🕌 Next Prayer
                </span>

                <h1 id="nextPrayer">
                    Fajr
                </h1>

                <h2 id="countdown">
                    00:00:00
                </h2>

                <p id="remainingText">
                    3h 45m Remaining
                </p>

                <button
                    class="heroButton"
                    id="viewPrayerBtn">

                    View Prayer Times

                </button>

            </div>

            <!-- RIGHT -->
            <div class="heroRight">

                <div class="prayerRing">

                    <svg viewBox="0 0 240 240">

                        <circle
                            class="ringTrack"
                            cx="120"
                            cy="120"
                            r="100"></circle>

                        <circle
                            id="ringProgress"
                            class="ringProgress"
                            cx="120"
                            cy="120"
                            r="100"></circle>

                    </svg>

                    <div class="ringCenter">
                        <span id="ringPercent">0%</span>
                    </div>

                </div>

                <div class="heroInfo">

                    <h3 id="hijriDate">
                        12 Muharram 1448 AH
                    </h3>

                    <p id="heroLocation">
                        Detecting Location...
                    </p>

                </div>

            </div>

        </div>

    </section>

    <!-- FEATURE GRID -->
    <section class="featureGrid">

    </section>

    <!-- BOTTOM NAV -->
    <nav class="bottomNav">

        <button>
            🏠
            <span>Home</span>
        </button>

        <button>
            📖
            <span>Quran</span>
        </button>

        <button>
            🕌
            <span>Prayer</span>
        </button>

        <button>
            🧭
            <span>Qibla</span>
        </button>

        <button>
            ⚙
            <span>Settings</span>
        </button>

    </nav>

</main>

<script type="module" src="assets/js/app.js"></script>
<script src="assets/js/dashboard.js"></script>

</body>
</html>
